name: Raco ModelOpt Conversion from Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: raco-modelopt-release
  cancel-in-progress: false

jobs:
  convert:
    if: github.event.release.tag_name == 'raco-modelopt-source-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      ORT_NUM_THREADS: "4"
      EXPECTED_MODEL_SHA256: "5ac2e8f7b8de8bfd894dd258add9ba885492f34cc255dfa0eeb5026541171d26"
      MODEL_NAME: "raco_aliked_lightglue_pipeline_k3072_folded_noshapes.onnx"
      MODEL_PATH: ${{ runner.temp }}/raco_aliked_lightglue_pipeline_k3072_folded_noshapes.onnx
      CALIBRATION_ROOT: ${{ runner.temp }}/raco_calibration
      OUTPUT_ROOT: ${{ runner.temp }}/raco_modelopt_output

    steps:
      - name: Checkout conversion scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the ONNX Release asset and verify SHA256
        id: download-source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MODEL_META < <(python - <<'PY'
          import json, os, sys
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          release = event["release"]
          expected_tag = "raco-modelopt-source-20261105"
          expected_name = "raco_aliked_lightglue_pipeline_k3072_folded_noshapes.onnx"
          if release.get("tag_name") != expected_tag:
              print("Unexpected release tag", file=sys.stderr)
              raise SystemExit(2)
          assets = [x for x in release.get("assets", []) if x.get("name") == expected_name]
          if len(assets) != 1:
              print(f"Expected exactly one release asset named {expected_name}", file=sys.stderr)
              raise SystemExit(3)
          url = assets[0].get("browser_download_url", "")
          if not url.startswith("https://github.com/"):
              print("Release asset URL is not a public GitHub HTTPS URL", file=sys.stderr)
              raise SystemExit(4)
          print(url)
          print(assets[0]["id"])
          PY
          )
          MODEL_URL="${MODEL_META[0]}"
          ASSET_ID="${MODEL_META[1]}"
          echo "::add-mask::$MODEL_URL"
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --connect-timeout 30 "$MODEL_URL" --output "$MODEL_PATH"
          unset MODEL_URL
          ACTUAL_SHA256="$(sha256sum "$MODEL_PATH" | awk '{print $1}')"
          echo "Downloaded bytes: $(stat -c%s "$MODEL_PATH")"
          echo "Expected SHA256: $EXPECTED_MODEL_SHA256"
          echo "Actual SHA256:   $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_MODEL_SHA256"

      - name: Install CPU PyTorch and NVIDIA ModelOpt
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install "nvidia-modelopt[onnx]==0.48.0" opencv-python-headless

      - name: Verify CPU-only ModelOpt environment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/modelopt_convert_raco_onnx.py scripts/generate_raco_synthetic_pairs.py
          python - <<'PY'
          import torch, onnx, onnxruntime as ort
          from modelopt.onnx.autocast import convert_to_mixed_precision
          from modelopt.onnx.quantization import quantize
          assert not torch.cuda.is_available()
          assert "CPUExecutionProvider" in ort.get_available_providers()
          print("torch:", torch.__version__)
          print("onnx:", onnx.__version__)
          print("onnxruntime:", ort.__version__)
          print("providers:", ort.get_available_providers())
          print("ModelOpt CPU imports: OK")
          PY
          python -m pip check

      - name: Generate synthetic calibration image pairs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_raco_synthetic_pairs.py \
            --output "$CALIBRATION_ROOT" \
            --pairs 12 \
            --size 1024 \
            --seed 20261104

      - name: Convert FP16 and FP8 mixed-precision variants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/modelopt_convert_raco_onnx.py \
            --model "$MODEL_PATH" \
            --calibration-root "$CALIBRATION_ROOT" \
            --output-root "$OUTPUT_ROOT" \
            --max-pairs 12 \
            --resolutions 512,1024 \
            --calibration-ep cpu \
            --color-order RGB \
            --pixel-divisor 255.0

      - name: Verify FP8 variants and ONNX package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys, zipfile
          root = pathlib.Path(os.environ["OUTPUT_ROOT"])
          packages = sorted(root.glob("raco_modelopt_variants_*.zip"))
          if not packages:
              raise SystemExit("No ONNX conversion ZIP was produced")
          with zipfile.ZipFile(packages[-1]) as z:
              manifest = json.loads(z.read("manifest.json"))
          fp16 = [x for x in manifest["variants"] if x["kind"] == "fp16" and x["status"] == "SUCCESS"]
          fp8 = [x for x in manifest["variants"] if x["kind"] == "fp8" and x["status"] == "SUCCESS"]
          print("FP16 successes:", len(fp16))
          print("FP8 successes:", len(fp8))
          for row in manifest["variants"]:
              print(row["status"], row["name"], row.get("error", ""))
          if not fp16:
              raise SystemExit("No FP16 variant succeeded")
          if not fp8:
              raise SystemExit("No FP8 Q/DQ variant succeeded on the real Raco ONNX")
          PY

      - name: Upload ONNX variants ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raco-modelopt-onnx-${{ github.run_id }}
          path: ${{ runner.temp }}/raco_modelopt_output/raco_modelopt_variants_*.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload debug package on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raco-modelopt-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/raco_modelopt_output/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Remove temporary public source ONNX Release asset
        if: always() && steps.download-source.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ steps.download-source.outputs.asset_id }}
        run: |
          set -euo pipefail
          if [[ -z "$ASSET_ID" ]]; then
            echo "No verified source asset ID; nothing to remove."
            exit 0
          fi
          curl --fail --silent --show-error --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          echo "Temporary source ONNX Release asset deleted."

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Raco ModelOpt conversion"
            echo "- Trigger: published source Release asset"
            echo "- Runner: GitHub-hosted Ubuntu CPU"
            echo "- Source SHA256: $EXPECTED_MODEL_SHA256"
            echo "- Calibration: 12 synthetic pairs at 512 and 1024"
            echo "- Output artifact: raco-modelopt-onnx-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
