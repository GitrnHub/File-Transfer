name: PikPak Mayday Speed Test
run-name: PikPak Mayday Speed Test

on:
  push:
    paths:
      - .github/workflows/pikpak-mayday-speed.yml

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIKPAK_PAT: ${{ secrets.PIKPAK_PAT }}
      PIKPAK_MCP_URL: https://api-open.mypikpak.com/mcp

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find Mayday MKV and measure streaming speed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pikpak-speed
          cd /tmp/pikpak-speed
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @modelcontextprotocol/client >/dev/null
          cat > speed.mjs <<'NODE'
          import { Client, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';
          import { performance } from 'node:perf_hooks';

          const token = process.env.PIKPAK_PAT;
          if (!token) throw new Error('PIKPAK_PAT is missing');

          const client = new Client(
            { name: 'github-actions-pikpak-mayday-speed', version: '1.0.0' },
            { versionNegotiation: { mode: 'auto' } }
          );
          const transport = new StreamableHTTPClientTransport(
            new URL(process.env.PIKPAK_MCP_URL),
            { authProvider: { token: async () => token } }
          );

          function decode(result) {
            const texts = (result?.content ?? []).filter(x => x?.type === 'text').map(x => x.text).filter(Boolean);
            if (!texts.length) return {};
            const joined = texts.join('\n');
            try { return JSON.parse(joined); } catch { return { raw_text: joined }; }
          }

          function findDownloadUrl(v) {
            if (!v) return null;
            if (typeof v === 'string') return /^https?:\/\//i.test(v) ? v : null;
            if (Array.isArray(v)) {
              for (const x of v) { const u = findDownloadUrl(x); if (u) return u; }
              return null;
            }
            if (typeof v === 'object') {
              for (const k of ['download_url', 'downloadUrl', 'url']) {
                if (typeof v[k] === 'string' && /^https?:\/\//i.test(v[k])) return v[k];
              }
              for (const x of Object.values(v)) { const u = findDownloadUrl(x); if (u) return u; }
            }
            return null;
          }

          async function listFolder(parentId) {
            const out = [];
            let pageToken = '';
            for (let page = 0; page < 100; page++) {
              const args = { parent_id: parentId, limit: 100 };
              if (pageToken) args.token = pageToken;
              const data = decode(await client.callTool({ name: 'ls', arguments: args }));
              const files = Array.isArray(data.files) ? data.files : [];
              out.push(...files);
              pageToken = data.next_page_token || data.nextPageToken || '';
              if (!pageToken || files.length === 0) break;
            }
            return out;
          }

          const matches = [];
          let scanned = 0;
          async function walk(parentId, depth = 0) {
            if (depth > 10 || scanned > 10000) return;
            const items = await listFolder(parentId);
            for (const item of items) {
              scanned++;
              if (item.kind === 'file') {
                const n = String(item.name || '').toLowerCase();
                if (n.includes('mayday') && n.endsWith('.mkv')) matches.push(item);
              } else if (item.kind === 'folder') {
                await walk(item.id, depth + 1);
              }
            }
          }

          try {
            await client.connect(transport);
            await walk('');
            if (!matches.length) throw new Error('No MKV file containing "mayday" was found');

            // Choose the first match; do not print its private file name in this public repository.
            const target = matches[0];
            const detail = decode(await client.callTool({ name: 'get', arguments: { id: target.id, url_type: 'download' } }));
            const url = findDownloadUrl(detail);
            if (!url) throw new Error('PikPak did not return a download URL');

            const capBytes = 1024 * 1024 * 1024; // 1 GiB maximum transfer
            const capMs = 20000;                 // or 20 seconds, whichever comes first
            const requestStart = performance.now();
            const resp = await fetch(url, {
              redirect: 'follow',
              headers: {
                'user-agent': 'Mozilla/5.0',
                'range': `bytes=0-${capBytes - 1}`
              }
            });
            const headersAt = performance.now();
            if (!resp.ok || !resp.body) throw new Error(`Download request failed: HTTP ${resp.status}`);

            const reader = resp.body.getReader();
            let bytes = 0;
            let firstByteAt = null;
            let lastAt = headersAt;
            while (bytes < capBytes) {
              const now = performance.now();
              if (firstByteAt !== null && now - firstByteAt >= capMs) break;
              const { done, value } = await reader.read();
              const arrived = performance.now();
              if (done) { lastAt = arrived; break; }
              if (firstByteAt === null) firstByteAt = arrived;
              bytes += value.byteLength;
              lastAt = arrived;
              if (bytes >= capBytes || lastAt - firstByteAt >= capMs) break;
            }
            try { await reader.cancel(); } catch {}

            const bodySeconds = firstByteAt === null ? 0 : Math.max((lastAt - firstByteAt) / 1000, 0.001);
            const endToEndSeconds = Math.max((lastAt - requestStart) / 1000, 0.001);
            const mib = bytes / 1048576;
            const bodyMiBs = mib / bodySeconds;
            const e2eMiBs = mib / endToEndSeconds;
            const result = {
              scanned_items: scanned,
              match_count: matches.length,
              selected_file_size_bytes: Number(target.size || 0),
              http_status: resp.status,
              range_honored: resp.status === 206,
              sample_bytes: bytes,
              sample_mib: Number(mib.toFixed(2)),
              ttfb_ms: Number((headersAt - requestStart).toFixed(1)),
              body_seconds: Number(bodySeconds.toFixed(3)),
              end_to_end_seconds: Number(endToEndSeconds.toFixed(3)),
              sustained_mib_per_s: Number(bodyMiBs.toFixed(2)),
              sustained_mbps: Number((bodyMiBs * 8 * 1048576 / 1000000).toFixed(2)),
              end_to_end_mib_per_s: Number(e2eMiBs.toFixed(2))
            };
            console.log('PIKPAK_SPEED_RESULT_V1 ' + JSON.stringify(result));
          } finally {
            try { await client.close(); } catch {}
          }
          NODE
          node speed.mjs
