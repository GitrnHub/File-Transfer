name: PikPak Recursive Read
run-name: PikPak Recursive Read

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pikpak-read-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIKPAK_PAT: ${{ secrets.PIKPAK_PAT }}
      PIKPAK_MCP_URL: https://api-open.mypikpak.com/mcp

    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$PIKPAK_PAT" ]; then
            echo "PIKPAK_PAT secret is missing or empty."
            exit 2
          fi
          echo "PIKPAK_PAT secret is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MCP client
        shell: bash
        run: |
          mkdir -p /tmp/pikpak-read
          cd /tmp/pikpak-read
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @modelcontextprotocol/client

      - name: Recursively list PikPak files
        shell: bash
        run: |
          cat > /tmp/pikpak-read/read.mjs <<'NODE'
          import { Client, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';
          import fs from 'node:fs';

          const token = process.env.PIKPAK_PAT;
          const url = process.env.PIKPAK_MCP_URL;
          const authProvider = { token: async () => token };
          const client = new Client(
            { name: 'github-actions-pikpak-recursive-read', version: '1.0.0' },
            { versionNegotiation: { mode: 'auto' } }
          );
          const transport = new StreamableHTTPClientTransport(new URL(url), { authProvider });

          const MAX_DEPTH = 8;
          const MAX_ITEMS = 5000;
          let total = 0;

          function decode(result) {
            const text = (result?.content ?? []).find(x => x?.type === 'text')?.text;
            if (!text) return {};
            try { return JSON.parse(text); }
            catch { return { raw_text: text }; }
          }

          async function listFolder(parentId) {
            const all = [];
            let pageToken = '';
            for (let page = 0; page < 100 && total < MAX_ITEMS; page++) {
              const args = { parent_id: parentId, limit: 100 };
              if (pageToken) args.token = pageToken;
              const result = await client.callTool({ name: 'ls', arguments: args });
              const data = decode(result);
              const files = Array.isArray(data.files) ? data.files : [];
              all.push(...files);
              total += files.length;
              pageToken = data.next_page_token || data.nextPageToken || '';
              if (!pageToken || files.length === 0) break;
            }
            return all;
          }

          async function walk(parentId, path, depth) {
            if (depth > MAX_DEPTH || total >= MAX_ITEMS) return [];
            const items = await listFolder(parentId);
            const out = [];
            for (const item of items) {
              const node = {
                id: item.id,
                name: item.name,
                kind: item.kind,
                size: item.size,
                mime_type: item.mime_type,
                file_category: item.file_category,
                modified: item.modified,
                hash: item.hash,
                path: path === '/' ? `/${item.name}` : `${path}/${item.name}`
              };
              out.push(node);
              if (item.kind === 'folder' && depth < MAX_DEPTH && total < MAX_ITEMS) {
                node.children = await walk(item.id, node.path, depth + 1);
              }
            }
            return out;
          }

          try {
            await client.connect(transport);
            const tree = await walk('', '/', 0);
            fs.writeFileSync('/tmp/pikpak-tree.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              max_depth: MAX_DEPTH,
              max_items: MAX_ITEMS,
              items_seen: total,
              tree
            }, null, 2));
            console.log(`PikPak recursive listing fetched successfully; ${total} item(s) seen. Contents are not printed to public logs.`);
          } finally {
            try { await client.close(); } catch {}
          }
          NODE
          cd /tmp/pikpak-read
          node read.mjs

      - name: Encrypt private result
        shell: bash
        run: |
          cat > /tmp/pikpak-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA230YtuQDZCvfqdn7dwQx
          gXWFqnFzy+6Z8TCi377ebmpA7OPgMFZfcPOd/9P3qQcJxCkLSCQn0ZGAE9H7R4zV
          9DA0swI4fHvbpzcYRcyww22N2KKMNfLRTT3hOsJpu1vMBEwF08jwmHyVwyKg3slN
          DjcBmKcFxJo61AkEVEZW2AnqnYl1R9Dze3JXSK1sXyoZe2m7DNytIjHRUkOoscMI
          9FkTNulUyEMiInhvDGj8TXnSu8JZXx2W6uG1G4DytkNa3vO/JTzqsx1viZSmd9r6
          VRb65s4UBLOlNKXKmxz9+o0LTF55Vzkh5N9GDm1D8iS+otcYtbCKhMLHts4d+avO
          IsXbN+goW0esPHPTfWJECt/STcymKEeVkU4hDOHARTIvnF38wCmFz6YkzxGmQNR2
          gYxzQkPEDyz/tzHye2LcHE+QUaN/hIxzuEhG4STeaPUD2hE+ITWXIUeKfLyQi+Mv
          y5bTT2M/iiTgVdkjUxaEaEGhx30tO6TMbWZVAkQV0+jBAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          mkdir -p encrypted-result
          openssl rand -hex 32 > /tmp/pikpak-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/pikpak-tree.json \
            -out encrypted-result/pikpak-tree.enc \
            -pass file:/tmp/pikpak-key.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pikpak-public.pem \
            -in /tmp/pikpak-key.txt \
            -out encrypted-result/key.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f /tmp/pikpak-tree.json /tmp/pikpak-key.txt

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: pikpak-recursive-result-${{ github.run_id }}
          path: encrypted-result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
