name: PikPak CLI Help Probe
on:
  push:
    paths:
      - .github/workflows/pikpak-cli-help.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install official PikPak CLI and inspect help
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --connect-timeout 15 --max-time 40 https://download.mypikpak.com/cli/install.sh -o /tmp/pikpak-install.sh
          sha256sum /tmp/pikpak-install.sh
          timeout 120 bash /tmp/pikpak-install.sh
          export PATH="$HOME/.local/bin:$PATH"
          command -v pikpak
          pikpak --version || true
          pikpak --help | head -n 110
          pikpak auth --help | head -n 100
          pikpak upload --help | head -n 110
