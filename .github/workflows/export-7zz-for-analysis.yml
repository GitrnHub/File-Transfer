name: Export 7-Zip Linux CLI for Static EXE Analysis
on:
  push:
    paths:
      - .github/workflows/export-7zz-for-analysis.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch official portable 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out archive
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120             https://www.7-zip.org/a/7z2604-linux-x64.tar.xz -o archive/7z.tar.xz
          tar -xf archive/7z.tar.xz -C archive
          find archive -name 7zz -type f -exec cp {} out/7zz \;
          chmod +x out/7zz
          out/7zz i | head -25
      - name: Export portable 7zz binary
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-7zz-linux
          path: out/7zz
          retention-days: 1
          compression-level: 0
