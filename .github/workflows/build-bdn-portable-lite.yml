name: Build BaiduNetdisk 8.9.2 Portable Lite
on:
  push:
    paths:
      - .github/workflows/build-bdn-portable-lite.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Fetch previously downloaded official installer and verify SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path payload -Force | Out-Null
          gh run download 39484634746 --repo "$env:GITHUB_REPOSITORY" --name file-transfer-17 --dir payload
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve original verified installer" }
          $p="payload\BaiduNetdisk_8.9.2.101.exe"
          $expected="3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086"
          if (!(Test-Path $p)) { throw "Source installer is missing" }
          $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "Official installer SHA mismatch: $hash" }
          Write-Output "OFFICIAL_SOURCE_OK $hash"
      - name: Static NSIS extract and strip unwanted modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output="publish\BaiduNetdisk_8.9.2.101_Portable"
          $app=Join-Path $output 'App'
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          $seven="C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $seven)) { choco install 7zip.install -y --no-progress }
          & $seven x "payload\BaiduNetdisk_8.9.2.101.exe" "-o$app" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract NSIS payload" }
          $before=Get-ChildItem -Path $app -File -Recurse
          $excluded=@(
            "module\ImageViewer",
            "module\AiEngine",
            "sysres",
            "AutoUpdate",
            '$PLUGINSDIR'
          )
          foreach ($e in $excluded) {
            $target=Join-Path $app $e
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
          $badnames=@(
            "netdisk-chrome-ext.crx","npYunWebDetect.dll","ServiceAssistans.exe",
            "YunDetectService.exe","YunUtilityService.exe","BaiduNetdiskService.Msixbundle",
            "kernelUpdate.exe","uninst.exe"
          )
          foreach($name in $badnames) { Remove-Item -LiteralPath (Join-Path $app $name) -ErrorAction SilentlyContinue -Force }
          $patterns=@("YunShellExt*.dll","YunOfficeAddin*.dll","ShellFolder*.dll",
            "ShellFolder*.exe","SystemFeatureSDK*.dll","Microsoft.*.Appx")
          foreach($p in $patterns) {
            Get-ChildItem $app -File -Filter $p -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          $needed=@(
            'BaiduNetdisk.exe','AppUtil.dll','Bull140U.dll','kernel.dll','updateagent.dll',
            'module\BrowserEngine\BaiduNetdiskUnite.exe',
            'module\BrowserEngine\resources\app.asar',
            'module\BrowserEngine\resources\core.asar'
          )
          foreach($p in $needed) { if (!(Test-Path (Join-Path $app $p))) { throw "Missing needed: $p" } }
          foreach($p in @('module\ImageViewer','module\AiEngine','sysres','AutoUpdate')) {
            if (Test-Path (Join-Path $app $p)) { throw "Removal failed: $p" }
          }
          New-Item -ItemType Directory -Path "$output\Data\Profile","$output\Data\Roaming",
            "$output\Data\Local","$output\Data\Temp" -Force | Out-Null
          $after=Get-ChildItem -Path $app -File -Recurse
          $manifest=[ordered]@{
            source_filename='BaiduNetdisk_8.9.2.101.exe'
            source_sha256='3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086'
            packaging='static 7-Zip extraction, no binary patch, no NSIS setup execution'
            before_count=$before.Count
            retained_count=$after.Count
            excluded_count=($before.Count-$after.Count)
            size_bytes=($after | Measure-Object Length -Sum).Sum
            removed_modules=$excluded
            removed_patterns=($badnames+$patterns)
            note='Retains updateagent.dll because BaiduNetdisk.exe imports it.'
            files=@($after | ForEach-Object {
              [ordered]@{
                path=$_.FullName.Substring((Resolve-Path $app).Path.Length+1).Replace('\','/')
                bytes=$_.Length
                sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$output\Manifest.json" -Encoding UTF8
          Write-Output "REMOVED_COUNT $($manifest.excluded_count)"
          Write-Output "REMAINING_COUNT $($manifest.retained_count)"
          Write-Output "REMAINING_BYTES $($manifest.size_bytes)"
      - name: Add portable launchers and Chinese readme
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output="publish\BaiduNetdisk_8.9.2.101_Portable"
          $entry=@'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          for %%I in ("%~dp0..") do set "BDN_PORTABLE_ROOT=%%~fI"
          set "USERPROFILE=%BDN_PORTABLE_ROOT%\Data\Profile"
          set "APPDATA=%BDN_PORTABLE_ROOT%\Data\Roaming"
          set "LOCALAPPDATA=%BDN_PORTABLE_ROOT%\Data\Local"
          set "HOME=%USERPROFILE%"
          set "TEMP=%BDN_PORTABLE_ROOT%\Data\Temp"
          set "TMP=%TEMP%"
          for %%D in ("%USERPROFILE%" "%APPDATA%" "%LOCALAPPDATA%" "%TEMP%") do if not exist %%D mkdir %%D
          cd /d "%~dp0"
          start "" /D "%~dp0" "%~dp0BaiduNetdisk.exe" %*
          '@
          [IO.File]::WriteAllText((Join-Path $output 'App\PortableEntry.cmd'),$entry)
          $main=@'
          @echo off
          setlocal
          call "%~dp0App\PortableEntry.cmd" %*
          '@
          [IO.File]::WriteAllText((Join-Path $output 'Run_Portable.cmd'),$main)
          $unite=@'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          set "BDN_PORTABLE_ROOT=%~dp0"
          set "USERPROFILE=%BDN_PORTABLE_ROOT%Data\Profile"
          set "APPDATA=%BDN_PORTABLE_ROOT%Data\Roaming"
          set "LOCALAPPDATA=%BDN_PORTABLE_ROOT%Data\Local"
          set "HOME=%USERPROFILE%"
          set "TEMP=%BDN_PORTABLE_ROOT%Data\Temp"
          set "TMP=%TEMP%"
          for %%D in ("%APPDATA%" "%LOCALAPPDATA%" "%TEMP%") do if not exist %%D mkdir %%D
          cd /d "%~dp0App\module\BrowserEngine"
          start "" /D "%~dp0App\module\BrowserEngine" "%~dp0App\module\BrowserEngine\BaiduNetdiskUnite.exe" --user-data-dir="%LOCALAPPDATA%\ElectronProfile" %*
          '@
          [IO.File]::WriteAllText((Join-Path $output 'Run_Unite_Experimental.cmd'),$unite)
          $sand=@'
          [CmdletBinding()]
          param([switch]$Compatibility)
          $ErrorActionPreference='Stop'
          $here=Split-Path -Parent $MyInvocation.MyCommand.Path
          $app=Join-Path $here 'App'
          $data=Join-Path $here 'Data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $sandbox=Join-Path $env:WINDIR 'System32\WindowsSandbox.exe'
          if (!(Test-Path $sandbox)) { throw 'Windows Sandbox is not available/enabled on this Windows edition.' }
          $x=New-Object System.Xml.XmlDocument
          $x.LoadXml('<Configuration/>')
          function Add-Node([System.Xml.XmlNode]$parent,[string]$name,[string]$value) {
            $n=$x.CreateElement($name); $n.InnerText=$value; [void]$parent.AppendChild($n); return $n
          }
          $cfg=$x.DocumentElement
          $maps=$x.CreateElement('MappedFolders');[void]$cfg.AppendChild($maps)
          foreach ($m in @(@($app,'C:\BDNPortable\App','true'),@($data,'C:\BDNPortable\Data','false'))) {
            $node=$x.CreateElement('MappedFolder');[void]$maps.AppendChild($node)
            [void](Add-Node $node 'HostFolder' ([IO.Path]::GetFullPath($m[0])))
            [void](Add-Node $node 'SandboxFolder' $m[1])
            [void](Add-Node $node 'ReadOnly' $m[2])
          }
          [void](Add-Node $cfg 'Networking' 'Enable')
          [void](Add-Node $cfg 'ClipboardRedirection' 'Disable')
          [void](Add-Node $cfg 'PrinterRedirection' 'Disable')
          [void](Add-Node $cfg 'vGPU' 'Disable')
          [void](Add-Node $cfg 'ProtectedClient' $(if($Compatibility){'Disable'}else{'Enable'}))
          $logon=$x.CreateElement('LogonCommand');[void]$cfg.AppendChild($logon)
          [void](Add-Node $logon 'Command' 'cmd.exe /c C:\BDNPortable\App\PortableEntry.cmd')
          $wsb=Join-Path $env:TEMP ('BaiduPortable_'+[guid]::NewGuid().ToString('N')+'.wsb')
          $x.Save($wsb)
          Start-Process -FilePath $sandbox -ArgumentList ('"'+$wsb+'"')
          '@
          [IO.File]::WriteAllText((Join-Path $output 'Launch_WindowsSandbox.ps1'),$sand)
          $sandcmd=@'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Launch_WindowsSandbox.ps1" %*
          if errorlevel 1 pause
          '@
          [IO.File]::WriteAllText((Join-Path $output 'Run_Sandbox.cmd'),$sandcmd)
          $verification=@'
          $ErrorActionPreference='Stop'
          $root=Split-Path -Parent $MyInvocation.MyCommand.Path
          $manifest=Get-Content (Join-Path $root 'Manifest.json') -Encoding UTF8 -Raw | ConvertFrom-Json
          $good=0; $bad=0
          foreach($f in $manifest.files){
            $p=Join-Path (Join-Path $root 'App') ($f.path.Replace('/','\'))
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){Write-Output "MISSING $($f.path)";$bad++;continue}
            $h=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -eq $f.sha256){$good++}else{Write-Output "HASH ERROR $($f.path)";$bad++}
          }
          Write-Output "OK $good | errors $bad"
          if($bad -gt 0){exit 1}
          '@
          [IO.File]::WriteAllText((Join-Path $output 'Verify_Original_Files.ps1'),$verification)
          $readme=@'
          百度网盘 8.9.2.101 - 便携化精简实验包

          源安装包 SHA256:
          3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086

          免安装普通启动：双击 Run_Portable.cmd。
          建议的隔离启动：Windows 11 Pro/Education/Enterprise 开启 Windows 沙盒后双击 Run_Sandbox.cmd。
          第三种仅排障：Run_Unite_Experimental.cmd 单独启动 Electron 宿主，未保证网盘完整功能。

          已移除：
          - module/ImageViewer 整个目录（图片查看）
          - module/AiEngine 整个目录（独立 OCR/AI 引擎）
          - sysres、所有 MSIX/Appx 系统集成包、NSIS 安装器插件
          - YunShellExt/YunOfficeAddin/ShellFolder/SystemFeatureSDK 系统整合模块
          - Chrome 扩展、Office 加载项、Windows 服务执行程序和独立自动升级执行文件

          仍需保留 updateagent.dll：主程序的 PE 导入表直接依赖它，删除会导致加载失败。
          可能有额外的内置 AI 页面与预览入口，删除独立模块不等于修改前端入口。

          注意：绿色版不等于限制系统权限。普通启动器只改变环境变量，不会阻止程序使用
          Windows Known Folders API、注册表、系统目录、网络或用户现有权限。
          主程序仍包含系统集成相关代码；不能保证绝对无注册表写入。
          Windows 沙盒模式把 App 挂载为只读、Data 挂载为可写；关闭沙盒后不会保留
          其他沙盒内部系统修改，但 Data 目录的数据保留。
          只有在 Windows 沙盒、Sandboxie 等隔离环境内，才能较可靠地限制宿主机访问。

          请勿以管理员身份运行。如出现 UAC 提权请求，请取消。
          如遇启动/登录/传输故障，请参考 TEST_RESULTS.txt，不能保证专有软件离线提取即完全可用。
          Windows GitHub Actions 冒烟测试：主进程成功创建，13 秒后仍存活，但无法验证 UI/登录。
          测试：https://github.com/GitrnHub/File-Transfer/actions/runs/39491849107
          校验文件：powershell -ExecutionPolicy Bypass -File .\Verify_Original_Files.ps1

          本包不修改原始可执行文件，不修改授权/登录/订阅机制。非百度官方发布。
          '@
          Set-Content -Path (Join-Path $output 'README_中文.txt') -Value $readme -Encoding UTF8
          $testing=@'
          原始安装文件 SHA-256 匹配 Microsoft WinGet 官方清单。
          使用 7-Zip 直接读取 NSIS payload, 不执行 installer。
          已在 GitHub Actions windows-latest 直接启动裁剪版 BaiduNetdisk.exe，
          13 秒后主进程仍在运行，未见 HKCU CurrentVersion\Run 变化。
          没有交互式桌面和百度帐号，不能验证 GUI、登录、上传、下载、
          其他注册表修改或全部系统副作用。这是实验版，并非完全经过验收的绿色软件。
          '@
          Set-Content -Path (Join-Path $output 'TEST_RESULTS.txt') -Value $testing -Encoding UTF8
          $errors=$null; $tokens=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path (Join-Path $output 'Launch_WindowsSandbox.ps1')).Path,
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw "Sandbox PS parser errors: $errors"}
          Write-Output 'ALL_LAUNCHER_FILES_CREATED'
      - name: Verify package contents and license-preserving hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='publish\BaiduNetdisk_8.9.2.101_Portable'
          $manifest=Get-Content "$root\Manifest.json" -Encoding UTF8 -Raw | ConvertFrom-Json
          if ($manifest.retained_count -ne 192) { throw "Expected 192 original files, got $($manifest.retained_count)" }
          if ($manifest.excluded_count -ne 788) { throw "Expected 788 files removed, got $($manifest.excluded_count)" }
          if ((Get-ChildItem "$root\App" -Recurse -File).Count -lt 193) { throw 'Unexpected app file count' }
          if ((Test-Path "$root\App\module\ImageViewer") -or (Test-Path "$root\App\module\AiEngine")) { throw 'Excluded module found' }
          if (!(Test-Path "$root\App\updateagent.dll")) { throw 'Mandatory loader dependency missing' }
          if (!(Test-Path "$root\Run_Portable.cmd")) { throw 'Launcher missing' }
          Write-Output 'PACKAGE_STRUCTURE_VERIFIED'
      - name: Upload one complete portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-8.9.2.101-Portable-Lite
          path: publish/BaiduNetdisk_8.9.2.101_Portable/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
