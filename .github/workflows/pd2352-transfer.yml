name: PD2352 firmware transfer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths:
      - ".github/workflows/pd2352-transfer.yml"

permissions:
  contents: write

concurrency:
  group: pd2352-firmware-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FILE_ID: "19WGVGBjJl8-01px0DSQyB0xp-_JcUZVE"
      EXPECTED_SIZE: "11506165372"
      OUTPUT_FILE: "PD2352_A_15.1.6.7.W10.V000L1_LA.QSSI.15.0.R1-00900-QSSI.0-1_System_Split_QFIL.zip"
      TAG: "pd2352-15.1.6.7-transfer"

    steps:
      - name: Check whether transfer is already complete
        id: status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[]?.name" 2>/dev/null || true)"
          if printf '%s\n' "$assets" | grep -Fxq "TRANSFER_COMPLETE.txt"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Transfer is already complete; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show runner capacity
        if: steps.status.outputs.complete != 'true'
        run: df -h /

      - name: Install gdown
        if: steps.status.outputs.complete != 'true'
        run: python -m pip install -q --disable-pip-version-check gdown

      - name: Try Google Drive download
        if: steps.status.outputs.complete != 'true'
        id: fetch
        shell: bash
        run: |
          set -uo pipefail
          echo "Trying Google Drive file $FILE_ID"
          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S')"

          if gdown "$FILE_ID" -O "$OUTPUT_FILE" --quiet; then
            actual="$(stat -c%s "$OUTPUT_FILE")"
            if [ "$actual" != "$EXPECTED_SIZE" ]; then
              echo "Downloaded size mismatch: got $actual, expected $EXPECTED_SIZE" >&2
              rm -f "$OUTPUT_FILE"
              echo "downloaded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            echo "Downloaded exact file: $actual bytes" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$OUTPUT_FILE"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "Google Drive quota is still blocking the source. This workflow will retry on the next schedule." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Verify and split into release-sized parts
        if: steps.fetch.outputs.downloaded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$OUTPUT_FILE" | awk '{print $1}' | tee firmware.sha256
          split -b 1900M -d -a 2 "$OUTPUT_FILE" "PD2352_15.1.6.7_QFIL.zip.part-"
          rm -f "$OUTPUT_FILE"

          cat > REASSEMBLE.txt <<'EOF'
          This is a private transfer copy split only because each GitHub Release asset must be under 2 GiB.

          Linux/macOS:
            cat PD2352_15.1.6.7_QFIL.zip.part-* > PD2352_firmware.zip
            echo "$(cat firmware.sha256)  PD2352_firmware.zip" | sha256sum -c -

          firmware.sha256 contains the SHA-256 of the original full ZIP.
          EOF

          ls -lh PD2352_15.1.6.7_QFIL.zip.part-* firmware.sha256 REASSEMBLE.txt

      - name: Create or reuse hidden draft release
        if: steps.fetch.outputs.downloaded == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n1 || true)"

          if [ -z "$release_id" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "main" --draft --title "PD2352 15.1.6.7 private transfer" --notes "Automated private transfer. This release remains a draft and is not published."
          fi

      - name: Upload firmware parts to draft release
        if: steps.fetch.outputs.downloaded == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" PD2352_15.1.6.7_QFIL.zip.part-* firmware.sha256 REASSEMBLE.txt --clobber --repo "$GITHUB_REPOSITORY"

          printf 'complete\n' > TRANSFER_COMPLETE.txt
          gh release upload "$TAG" TRANSFER_COMPLETE.txt --clobber --repo "$GITHUB_REPOSITORY"

          echo "Firmware transfer completed into a DRAFT release." >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
