name: Inspect verified BaiduNetdisk NSIS
on:
  push:
    paths:
      - .github/workflows/inspect-baidunetdisk-nsis.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download original verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir payload
          gh run download 39484634746 --repo "$GITHUB_REPOSITORY" --name file-transfer-17 --dir payload
          echo '3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086  payload/BaiduNetdisk_8.9.2.101.exe' | sha256sum -c -
      - name: Inspect and test installer archive (do not execute)
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          mkdir -p report
          7z i > report/7z-formats.txt
          7z l -slt payload/BaiduNetdisk_8.9.2.101.exe > report/installer-file-list.txt 2>&1
          7z t payload/BaiduNetdisk_8.9.2.101.exe > report/installer-test.txt 2>&1
          echo 'SHA256: 3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086' > report/report.txt
          echo -n 'FILE ENTRIES: ' >> report/report.txt
          grep -c '^Path = ' report/installer-file-list.txt >> report/report.txt || true
          echo -n 'DIR ENTRIES: ' >> report/report.txt
          grep -c '^Folder = +' report/installer-file-list.txt >> report/report.txt || true
          echo 'TOP ITEMS:' >> report/report.txt
          grep '^Path = ' report/installer-file-list.txt | head -n 60 >> report/report.txt || true
          echo 'TEST SUMMARY:' >> report/report.txt
          tail -n 25 report/installer-test.txt >> report/report.txt
          cat report/report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload small inspection texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baidunetdisk-nsis-inspection
          path: report/
          retention-days: 1
