name: REA Ghidra 12.1.4 transfer segments
on:
  push:
    branches: [chore/rea-ghidra-bridge-20261019]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and verify official Ghidra release
        run: |
          set -euo pipefail
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl -fsSL --retry 5 --retry-delay 3 -o ghidra.zip "$URL"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip" | sha256sum -c -
          split -b 185M -d -a 2 ghidra.zip ghidra.part.
          ls -lh ghidra.part.*
      - name: Part 00
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-00
          path: ghidra.part.00
          compression-level: 0
          retention-days: 1
      - name: Part 01
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-01
          path: ghidra.part.01
          compression-level: 0
          retention-days: 1
      - name: Part 02
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-part-02
          path: ghidra.part.02
          compression-level: 0
          retention-days: 1
