name: BaiduNetdisk Drive-safe Chunks
on:
  push:
    paths:
      - .github/workflows/baidunetdisk-drive-parts.yml
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Retrieve verified original installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir payload
          gh run download 39484634746 --repo "$GITHUB_REPOSITORY" --name file-transfer-17 --dir payload
          echo '3bb9c6066dee502e8852170ea57cf52b3134c96521dffb6ee3d13d0862fd4086  payload/BaiduNetdisk_8.9.2.101.exe' | sha256sum -c -
          mkdir -p chunks
          split -b 80m -d -a 3 --numeric-suffixes=1 payload/BaiduNetdisk_8.9.2.101.exe chunks/BaiduNetdisk_8.9.2.101.exe.
          sha256sum chunks/* > chunks-checksums.txt
          ls -lh chunks/
      - name: Upload small chunk 1
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-001
          path: chunks/BaiduNetdisk_8.9.2.101.exe.001
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 2
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-002
          path: chunks/BaiduNetdisk_8.9.2.101.exe.002
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 3
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-003
          path: chunks/BaiduNetdisk_8.9.2.101.exe.003
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 4
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-004
          path: chunks/BaiduNetdisk_8.9.2.101.exe.004
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 5
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-005
          path: chunks/BaiduNetdisk_8.9.2.101.exe.005
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 6
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-006
          path: chunks/BaiduNetdisk_8.9.2.101.exe.006
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small chunk 7
        uses: actions/upload-artifact@v4
        with:
          name: BaiduNetdisk-chunk-007
          path: chunks/BaiduNetdisk_8.9.2.101.exe.007
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
