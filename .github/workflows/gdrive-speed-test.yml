name: PD2352 mirror download probe

on:
  push:
    paths:
      - ".github/workflows/gdrive-speed-test.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FirmwareDrive download endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://firmwaredrive.com/index.php?a=downloads&b=file&c=download&id=108627'
          echo "--- redirect/header chain ---"
          curl -sSIL -A 'Mozilla/5.0' --max-time 30 "$URL" || true
          echo "--- tiny range probe ---"
          curl -sSL -A 'Mozilla/5.0' --range 0-1023 --max-time 30             -D headers.txt "$URL" -o sample.bin || true
          cat headers.txt || true
          echo "Sample bytes: $(wc -c < sample.bin 2>/dev/null || echo 0)"
          file sample.bin 2>/dev/null || true
          head -c 200 sample.bin 2>/dev/null | strings | head -n 10 || true
