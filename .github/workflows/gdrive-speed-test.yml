name: PD2352 firmware transfer test

on:
  push:
    paths:
      - ".github/workflows/gdrive-speed-test.yml"
  workflow_dispatch:

jobs:
  transfer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Runner disk
        run: df -h

      - name: Install gdown
        run: python -m pip install -q --disable-pip-version-check gdown

      - name: Test exact PD2352 file
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='19WGVGBjJl8-01px0DSQyB0xp-_JcUZVE'
          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S')"
          START_NS=$(date +%s%N)
          gdown "$FILE_ID" -O /dev/null
          END_NS=$(date +%s%N)
          ELAPSED=$(awk -v s="$START_NS" -v e="$END_NS" 'BEGIN {printf "%.3f", (e-s)/1000000000}')
          echo "Elapsed: $ELAPSED s"
          echo "UTC end: $(date -u '+%Y-%m-%d %H:%M:%S')"
