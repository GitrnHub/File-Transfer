name: PD2352 mirror probe

on:
  push:
    paths:
      - ".github/workflows/gdrive-speed-test.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FirmwareDrive exact file page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://firmwaredrive.com/index.php?a=downloads&b=file&id=108627'
          curl -L --fail --silent --show-error -A 'Mozilla/5.0' "$URL" -o page.html
          echo "Page bytes: $(wc -c < page.html)"
          echo "--- candidate links ---"
          grep -Eoi 'href="[^"]+"|https?://[^"<> ]+' page.html |             grep -Ei 'download|cdn|drive|108627|zip|file' | head -n 100 || true
          echo "--- title markers ---"
          grep -Eoi 'PD2352[^<"]+|10\.72 GB|login|register|download' page.html | head -n 60 || true
