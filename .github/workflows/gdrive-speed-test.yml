name: Google Drive direct-link speed test

on:
  push:
    paths:
      - ".github/workflows/gdrive-speed-test.yml"
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install gdown
        run: python -m pip install -q --disable-pip-version-check gdown

      - name: Stream Google Drive file to /dev/null
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.google.com/file/d/13xLyrVGUyF7DMG8C_EmgLZEcFghMoQN2/view'
          SIZE_BYTES=5825895630

          echo "UTC start: $(date -u '+%Y-%m-%d %H:%M:%S')"
          START_NS=$(date +%s%N)

          gdown --fuzzy "$URL" -O /dev/null --quiet

          END_NS=$(date +%s%N)
          ELAPSED=$(awk -v s="$START_NS" -v e="$END_NS" 'BEGIN {printf "%.3f", (e-s)/1000000000}')
          awk -v size="$SIZE_BYTES" -v sec="$ELAPSED" 'BEGIN {
            printf "Expected file size: %d bytes (%.2f GiB)\n", size, size/1073741824;
            printf "Elapsed: %.3f s\n", sec;
            printf "Average: %.2f MiB/s\n", (size/sec)/1048576;
            printf "Average: %.2f Mbit/s\n", (size/sec)*8/1000000;
          }'
          echo "UTC end: $(date -u '+%Y-%m-%d %H:%M:%S')"
