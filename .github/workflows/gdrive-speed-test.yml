name: PD2352 ONFIX probe

on:
  push:
    paths:
      - ".github/workflows/gdrive-speed-test.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ONFIX listing
        shell: bash
        run: |
          set -euo pipefail
          URL='https://onfix.cn/rom?bid=5&mid=29970&page=1'
          curl -L --silent --show-error -A 'Mozilla/5.0' "$URL" -o page.html
          echo "Page bytes: $(wc -c < page.html)"
          echo "--- matching context ---"
          grep -n -B 8 -A 12 '15\.1\.6\.7\.W10' page.html | head -n 160 || true
          echo "--- candidate URLs ---"
          grep -Eoi 'https?://[^"<> ]+|href="[^"]+"|data-[a-zA-Z0-9_-]+="[^"]+"' page.html |             grep -Ei 'rom|down|download|file|2352|6\.7|api' | head -n 160 || true
